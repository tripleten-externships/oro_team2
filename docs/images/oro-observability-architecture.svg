<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">ORO Observability solution architecture with AWS services</title>
  <desc id="description">A solution architecture diagram using standard AWS service icons. Public homeowners and protected administrators access CloudFront protected by AWS WAF. CloudFront routes the public app to Amplify, the admin bundle to private Amazon S3, anonymous events to an AWS Lambda ingest function, and administrator requests to a separate Lambda function. Amazon Cognito protects administrator sign-in. The functions use Amazon DynamoDB and a private S3 export bucket.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#232F3E"/>
    </marker>
    <marker id="arrow-auth" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#5B6470"/>
    </marker>
    <style>
      .canvas { fill: #FFFFFF; }
      .aws-boundary { fill: #F7F8FA; stroke: #7C8897; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .region-boundary { fill: #FFFFFF; stroke: #D5DBDB; stroke-width: 1.25; }
      .client { fill: #FFFFFF; stroke: #687078; stroke-width: 1.5; }
      .service { fill: #FFFFFF; stroke: #CBD5DB; stroke-width: 1.25; }
      .entry { fill: #FFFFFF; stroke: #8C4FFF; stroke-width: 2; }
      .heading { fill: #161E2D; font: 600 25px Arial, sans-serif; }
      .boundary-title { fill: #161E2D; font: 600 18px Arial, sans-serif; }
      .node-title { fill: #161E2D; font: 600 16px Arial, sans-serif; }
      .node-detail { fill: #5B6470; font: 13px Arial, sans-serif; }
      .route { fill: #3F4B5A; font: 12px Arial, sans-serif; }
      .flow { fill: none; stroke: #232F3E; stroke-width: 2; marker-end: url(#arrow); }
      .auth-flow { fill: none; stroke: #5B6470; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow-auth); }
      .note { fill: #5B6470; font: 13px Arial, sans-serif; }
      .small-note { fill: #5B6470; font: 12px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="820" class="canvas"/>
  <text x="56" y="58" class="heading">ORO Observability MVP · solution architecture</text>
  <text x="56" y="86" class="note">Solid arrows show request or data direction. Dashed arrows show the administrator authentication round trip.</text>

  <rect x="300" y="118" width="1080" height="610" rx="10" class="aws-boundary"/>
  <text x="326" y="154" class="boundary-title">AWS Cloud</text>

  <rect x="730" y="174" width="620" height="510" rx="8" class="region-boundary"/>
  <text x="754" y="205" class="boundary-title">Regional resources · us-east-1</text>

  <!-- Request and data flows are placed behind service nodes. -->
  <path d="M264 380 H560" class="flow"/>
  <path d="M264 585 H508 V448 H560" class="flow"/>
  <path d="M706 364 H746 V270 H782" class="flow"/>
  <path d="M706 384 H746 V304 H1082" class="flow"/>
  <path d="M706 414 H782" class="flow"/>
  <path d="M706 438 H746 V594 H782" class="flow"/>
  <path d="M1002 440 H1074" class="flow"/>
  <path d="M1002 598 H1040 V484 H1074" class="flow"/>
  <path d="M1002 598 H1082" class="flow"/>
  <path d="M160 560 V250 H390" class="auth-flow"/>
  <path d="M505 274 V694 H160 V642" class="auth-flow"/>

  <text x="390" y="368" class="route">public app</text>
  <text x="392" y="490" class="route">admin page + API</text>
  <text x="732" y="258" class="route">/*</text>
  <text x="882" y="292" class="route">/oro-admin/*</text>
  <text x="730" y="404" class="route">/api/observability/events</text>
  <text x="734" y="576" class="route">/api/observability/admin/*</text>
  <text x="1014" y="428" class="route">conditional PutItem</text>
  <text x="1010" y="540" class="route">GSI queries</text>
  <text x="1014" y="586" class="route">CSV export</text>
  <text x="182" y="238" class="route">sign in · PKCE</text>
  <text x="182" y="716" class="route">authorization return</text>

  <!-- Browsers -->
  <rect x="56" y="330" width="208" height="100" rx="8" class="client"/>
  <text x="160" y="370" text-anchor="middle" class="node-title">Homeowner browser</text>
  <text x="160" y="397" text-anchor="middle" class="node-detail">Public app · no sign-in</text>

  <rect x="56" y="542" width="208" height="100" rx="8" class="client"/>
  <text x="160" y="582" text-anchor="middle" class="node-title">Administrator browser</text>
  <text x="160" y="609" text-anchor="middle" class="node-detail">/oro-admin · access token</text>

  <!-- Amazon Cognito -->
  <rect x="390" y="168" width="230" height="106" rx="8" class="service"/>
  <image href="aws/Arch_Amazon-Cognito_32.svg" x="408" y="191" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="470" y="208" class="node-title">Amazon Cognito</text>
  <text x="470" y="232" class="node-detail">Hosted UI · Authorization Code + PKCE</text>
  <text x="470" y="252" class="node-detail">oro-admin group required</text>

  <!-- CloudFront public entry and AWS WAF -->
  <rect x="560" y="330" width="146" height="140" rx="8" class="entry"/>
  <image href="aws/Arch_Amazon-CloudFront_32.svg" x="578" y="350" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <image href="aws/Arch_AWS-WAF_32.svg" x="638" y="350" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="633" y="419" text-anchor="middle" class="node-title">CloudFront</text>
  <text x="633" y="442" text-anchor="middle" class="node-detail">+ AWS WAF</text>
  <text x="633" y="460" text-anchor="middle" class="node-detail">only public entry</text>

  <!-- Public application origin -->
  <rect x="782" y="228" width="220" height="98" rx="8" class="service"/>
  <image href="aws/Arch_AWS-Amplify_32.svg" x="802" y="252" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="866" y="267" class="node-title">AWS Amplify Hosting</text>
  <text x="866" y="291" class="node-detail">Public React application</text>

  <!-- Private admin assets -->
  <rect x="1082" y="228" width="238" height="98" rx="8" class="service"/>
  <image href="aws/Arch_Amazon-Simple-Storage-Service_32.svg" x="1102" y="252" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="1166" y="267" class="node-title">Amazon S3 · admin assets</text>
  <text x="1166" y="291" class="node-detail">Private bundle origin</text>

  <!-- Ingest Lambda -->
  <rect x="782" y="390" width="220" height="100" rx="8" class="service"/>
  <image href="aws/Arch_AWS-Lambda_32.svg" x="802" y="416" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="866" y="430" class="node-title">AWS Lambda · ingest</text>
  <text x="866" y="454" class="node-detail">Validates anonymous events</text>
  <text x="866" y="474" class="node-detail">CloudFront IP + geography</text>

  <!-- DynamoDB -->
  <rect x="1074" y="390" width="246" height="116" rx="8" class="service"/>
  <image href="aws/Arch_Amazon-DynamoDB_32.svg" x="1094" y="425" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="1158" y="431" class="node-title">Amazon DynamoDB · events</text>
  <text x="1158" y="455" class="node-detail">Daily GSI · four shards · 30-day TTL</text>
  <text x="1158" y="475" class="node-detail">Encryption and point-in-time recovery</text>

  <!-- Admin Lambda -->
  <rect x="782" y="550" width="220" height="100" rx="8" class="service"/>
  <image href="aws/Arch_AWS-Lambda_32.svg" x="802" y="576" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="866" y="590" class="node-title">AWS Lambda · admin</text>
  <text x="866" y="614" class="node-detail">Bounded metrics and CSV</text>
  <text x="866" y="634" class="node-detail">Validates admin access token</text>

  <!-- Temporary exports -->
  <rect x="1082" y="550" width="238" height="100" rx="8" class="service"/>
  <image href="aws/Arch_Amazon-Simple-Storage-Service_32.svg" x="1102" y="576" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="1166" y="590" class="node-title">Amazon S3 · exports</text>
  <text x="1166" y="614" class="node-detail">Private CSV files · 24-hour expiry</text>

  <text x="56" y="776" class="note">Function URLs are protected with CloudFront Origin Access Control and SigV4. No API Gateway, VPC, ALB, NAT, or public S3 bucket is used.</text>
  <text x="56" y="800" class="small-note">IP is stored only in DynamoDB; dashboards and CSV exports exclude IP addresses, tokens, financial values, questionnaire answers, and personal data.</text>
</svg>
