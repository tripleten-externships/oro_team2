<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">ORO Observability MVP flows</title>
  <desc id="description">The upper flow shows the public homeowner journey and the anonymous event path. The lower flow shows the protected administrator journey. Every arrow points in the direction the user action, event, request, or data travels.</desc>
  <defs>
    <marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5">
      <path d="M0,0 L8,4 L0,8 Z" fill="#09453B"/>
    </marker>
    <marker id="arrow-gold" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B4209"/>
    </marker>
    <style>
      .lane { fill: #FBF6ED; stroke: #85938F; stroke-width: 1.5; }
      .node { fill: #FFFFFF; stroke: #09453B; stroke-width: 2; }
      .node-accent { fill: #E2F4EA; stroke: #09453B; stroke-width: 2; }
      .node-private { fill: #FFF4CD; stroke: #5B4209; stroke-width: 2; }
      .heading { fill: #06281D; font: 600 22px Georgia, serif; }
      .subheading { fill: #06281D; font: 600 16px Arial, sans-serif; }
      .label { fill: #06281D; font: 600 15px Arial, sans-serif; }
      .detail { fill: #6F6D69; font: 13px Arial, sans-serif; }
      .line { fill: none; stroke: #09453B; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #5B4209; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gold); }
      .caption { fill: #6F6D69; font: 12px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#FBF6ED"/>
  <text x="54" y="54" class="heading">ORO Observability MVP · user and data flows</text>
  <text x="54" y="80" class="detail">Each arrow shows the direction of the flow. Solid green is public application or event traffic; dashed gold is protected admin authentication.</text>

  <rect x="40" y="108" width="1120" height="268" rx="18" class="lane"/>
  <text x="66" y="142" class="subheading">1. Public homeowner journey and anonymous event capture</text>

  <rect x="70" y="214" width="120" height="84" rx="12" class="node"/>
  <text x="130" y="248" text-anchor="middle" class="label">Homeowner</text>
  <text x="130" y="271" text-anchor="middle" class="detail">public browser</text>

  <rect x="245" y="214" width="130" height="84" rx="12" class="node"/>
  <text x="310" y="248" text-anchor="middle" class="label">Start</text>
  <text x="310" y="271" text-anchor="middle" class="detail">choose a journey</text>

  <rect x="435" y="166" width="138" height="76" rx="12" class="node"/>
  <text x="504" y="197" text-anchor="middle" class="label">Guided flow</text>
  <text x="504" y="219" text-anchor="middle" class="detail">assessment</text>

  <rect x="435" y="278" width="138" height="76" rx="12" class="node"/>
  <text x="504" y="309" text-anchor="middle" class="label">Direct flow</text>
  <text x="504" y="331" text-anchor="middle" class="detail">compare all options</text>

  <rect x="635" y="214" width="142" height="84" rx="12" class="node-accent"/>
  <text x="706" y="248" text-anchor="middle" class="label">Results</text>
  <text x="706" y="271" text-anchor="middle" class="detail">details · selection · compare</text>

  <rect x="820" y="214" width="142" height="84" rx="12" class="node-accent"/>
  <text x="891" y="248" text-anchor="middle" class="label">Event tracker</text>
  <text x="891" y="271" text-anchor="middle" class="detail">fixed enums only</text>

  <rect x="1010" y="166" width="125" height="78" rx="12" class="node-private"/>
  <text x="1072" y="198" text-anchor="middle" class="label">Ingestion API</text>
  <text x="1072" y="220" text-anchor="middle" class="detail">POST /events</text>

  <rect x="1010" y="286" width="125" height="74" rx="12" class="node-private"/>
  <text x="1072" y="317" text-anchor="middle" class="label">DynamoDB</text>
  <text x="1072" y="339" text-anchor="middle" class="detail">event store</text>

  <path d="M190 256 H245" class="line"/>
  <path d="M375 242 H405 V204 H435" class="line"/>
  <path d="M375 270 H405 V316 H435" class="line"/>
  <path d="M573 204 H605 V256 H635" class="line"/>
  <path d="M573 316 H605 V256 H635" class="line"/>
  <path d="M777 256 H820" class="line"/>
  <path d="M962 256 H985 V205 H1010" class="line"/>
  <path d="M1072 244 V286" class="line"/>
  <text x="780" y="201" class="caption">non-blocking anonymous events</text>
  <text x="974" y="188" class="caption">validated request</text>

  <rect x="40" y="412" width="1120" height="210" rx="18" class="lane"/>
  <text x="66" y="446" class="subheading">2. Protected admin insights and export</text>

  <rect x="70" y="498" width="130" height="82" rx="12" class="node-private"/>
  <text x="135" y="531" text-anchor="middle" class="label">ORO admin</text>
  <text x="135" y="554" text-anchor="middle" class="detail">opens /oro-admin</text>

  <rect x="270" y="498" width="150" height="82" rx="12" class="node-private"/>
  <text x="345" y="531" text-anchor="middle" class="label">Cognito Hosted UI</text>
  <text x="345" y="554" text-anchor="middle" class="detail">Code + PKCE</text>

  <rect x="495" y="498" width="155" height="82" rx="12" class="node-accent"/>
  <text x="572" y="531" text-anchor="middle" class="label">Admin dashboard</text>
  <text x="572" y="554" text-anchor="middle" class="detail">bounded metrics</text>

  <rect x="725" y="498" width="135" height="82" rx="12" class="node"/>
  <text x="792" y="531" text-anchor="middle" class="label">Admin API</text>
  <text x="792" y="554" text-anchor="middle" class="detail">group validation</text>

  <rect x="935" y="498" width="170" height="82" rx="12" class="node-private"/>
  <text x="1020" y="531" text-anchor="middle" class="label">Metrics and CSV</text>
  <text x="1020" y="554" text-anchor="middle" class="detail">private, temporary export</text>

  <path d="M200 527 H270" class="dashed"/>
  <path d="M420 527 H495" class="dashed"/>
  <path d="M650 539 H725" class="line"/>
  <path d="M860 539 H935" class="line"/>
  <text x="214" y="488" class="caption">sign in</text>
  <text x="433" y="488" class="caption">authorized return</text>
  <text x="660" y="488" class="caption">metrics or export request</text>
  <text x="875" y="488" class="caption">query and create CSV</text>

  <text x="66" y="650" class="detail">No home value, balance, rate, cash need, age, answers, names, email addresses, or free text enters the event path.</text>
</svg>
